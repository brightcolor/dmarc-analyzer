[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dmarc-analyzer"
version = "0.1.0"
description = "Multi-tenant DMARC aggregate report analyzer"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "smtp_inbound"]
omit = ["*/tests/*", "*/migrations/*", "*/scripts/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert in tests
    "B008",  # FastAPI Depends() calls in function defaults
    "S311",  # random not used for security here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"migrations/*" = ["ALL"]
