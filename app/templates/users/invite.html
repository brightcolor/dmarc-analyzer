{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header"><h6 class="mb-0"><i class="bi bi-person-plus me-2"></i>Invite User</h6></div>
      <div class="card-body">
        <form method="post" action="/users/invite">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required autofocus>
            <div class="form-text">If the user doesn't exist, a new account will be created.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" placeholder="Optional">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required minlength="8">
            <div class="form-text">Required for new accounts. Existing accounts keep their password.</div>
          </div>
          <div class="mb-4">
            <label class="form-label">Role</label>
            <select name="role" class="form-select">
              {% for r in roles %}
              <option value="{{ r }}" {% if r == 'analyst' %}selected{% endif %}>{{ r | replace('_', ' ') | title }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Invite</button>
            <a href="/users" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
