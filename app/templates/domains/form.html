{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header"><h6 class="mb-0"><i class="bi bi-globe me-2"></i>{{ page_title }}</h6></div>
      <div class="card-body">
        {% if error %}
        <div class="alert alert-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}</div>
        {% endif %}
        <form method="post" action="/domains/new">
          <div class="mb-3">
            <label class="form-label">Domain Name</label>
            <input type="text" name="name" class="form-control" placeholder="example.com"
                   value="{{ domain.name if domain else '' }}" required autofocus>
            <div class="form-text">Enter the root domain (e.g. <code>example.com</code>). Do not include <code>_dmarc.</code> prefix.</div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Add Domain</button>
            <a href="/domains" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
