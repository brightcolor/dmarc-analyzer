{% if pages > 1 %}
<nav aria-label="Pagination">
  <ul class="pagination pagination-sm mb-0 justify-content-center">
    <li class="page-item {% if page <= 1 %}disabled{% endif %}">
      <a class="page-link" href="?page={{ page - 1 }}{% for k, v in request.query_params.items() %}{% if k != 'page' %}&{{ k }}={{ v }}{% endif %}{% endfor %}">
        <i class="bi bi-chevron-left"></i>
      </a>
    </li>
    {% for p in range([1, page - 2]|max, [pages + 1, page + 3]|min) %}
    <li class="page-item {% if p == page %}active{% endif %}">
      <a class="page-link" href="?page={{ p }}{% for k, v in request.query_params.items() %}{% if k != 'page' %}&{{ k }}={{ v }}{% endif %}{% endfor %}">{{ p }}</a>
    </li>
    {% endfor %}
    <li class="page-item {% if page >= pages %}disabled{% endif %}">
      <a class="page-link" href="?page={{ page + 1 }}{% for k, v in request.query_params.items() %}{% if k != 'page' %}&{{ k }}={{ v }}{% endif %}{% endfor %}">
        <i class="bi bi-chevron-right"></i>
      </a>
    </li>
  </ul>
</nav>
{% endif %}
