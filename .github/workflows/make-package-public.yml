name: Make GHCR package public

on:
  workflow_dispatch:

jobs:
  set-public:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set package visibility to public
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/dmarc-analyzer \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
